<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Forum</title>
  <style>
    :root {
      --bg: #111318;
      --sidebar: #171a21;
      --panel: #1e222b;
      --panel-2: #252a36;
      --text: #eceff4;
      --muted: #9aa2b1;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --border: #2c313c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }
    .auth-card h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .auth-card input, .auth-card button { width: 100%; margin-top: 10px; }
    input {
      font: inherit; font-size: 13px;
      background: var(--sidebar); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 9px 10px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    button {
      font: inherit; font-size: 13px; font-weight: 500;
      background: var(--accent); color: #fff;
      border: none; border-radius: 5px; padding: 9px 12px; cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(88, 101, 242, 0.35);
      user-select: none;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(0.98); filter: brightness(0.9); }
    .tap-pressed { transform: scale(0.98) !important; filter: brightness(0.88) !important; }
    button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    button.ghost:hover:not(:disabled) { background: #2f3646; }
    .tag {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 1px 6px; border-radius: 4px;
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
      margin-left: 5px;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .notice { color: #79c0ff; font-size: 12px; min-height: 22px; margin-top: 8px; }
    .notice.err { color: #f85149; }
  </style>
</head>
<body>
  <div id="guest-screen" class="auth-wrap">
    <form id="auth-form" class="auth-card" novalidate>
      <h1>Connexion au forum <span class="tag">v17</span></h1>
      <div class="muted">Connecte-toi ou crée un compte avec ton pseudo et ton mot de passe.</div>
      <div id="guest-notice" class="notice"></div>

      <input type="text" id="auth-username" placeholder="Pseudo" autocomplete="username" />
      <input type="password" id="auth-password" placeholder="Mot de passe" autocomplete="current-password" />

      <button type="button" id="btn-login">Se connecter</button>
      <button type="button" id="btn-signup" class="ghost">Créer un compte</button>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://sdgkdiybppvsclgakdem.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_eSAcsSsTMF9p5jBUa0tIkA_XnsH3nxP';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const FORUM_PAGE = 'forum-v17.html';

    const setNotice = (msg, isErr = false) => {
      const el = document.getElementById('guest-notice');
      if (!el) return;
      el.textContent = msg || '';
      el.classList.toggle('err', !!isErr);
    };

    function normalizeUsername(raw) {
      return (raw || '').trim().replace(/\s+/g, ' ');
    }
    function usernameToSynthEmail(raw) {
      const clean = normalizeUsername(raw)
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9._-]/g, '_');
      const safe = clean || 'membre';
      return `${safe}@forum.local`;
    }
    async function isUsernameTaken(rawUsername) {
      const target = normalizeUsername(rawUsername).toLowerCase();
      if (!target) return false;
      const { data, error } = await supabase
        .from('profiles')
        .select('id, username');
      if (error || !data) return false;
      return data.some(p => normalizeUsername(p.username || '').toLowerCase() === target);
    }

    function bindUniversalTap(el, handler) {
      if (!el || typeof handler !== 'function') return;
      if (el.dataset.tapBound === '1') return;
      el.dataset.tapBound = '1';

      let lastFireAt = 0;
      let touchStartX = 0;
      let touchStartY = 0;
      let touchMoved = false;

      const invoke = (ev) => {
        if (el.disabled) return;
        const now = Date.now();
        if (now - lastFireAt < 220) return;
        lastFireAt = now;
        try {
          const res = handler(ev);
          if (res && typeof res.catch === 'function') {
            res.catch((err) => setNotice(err && err.message ? err.message : 'Erreur action', true));
          }
        } catch (err) {
          setNotice(err && err.message ? err.message : 'Erreur action', true);
        }
      };

      el.addEventListener('touchstart', (ev) => {
        if (el.disabled) return;
        const t = ev.touches && ev.touches[0];
        touchStartX = t ? t.clientX : 0;
        touchStartY = t ? t.clientY : 0;
        touchMoved = false;
        el.classList.add('tap-pressed');
      }, { passive: true });

      el.addEventListener('touchmove', (ev) => {
        const t = ev.touches && ev.touches[0];
        if (!t) return;
        if (Math.abs(t.clientX - touchStartX) > 12 || Math.abs(t.clientY - touchStartY) > 12) {
          touchMoved = true;
          el.classList.remove('tap-pressed');
        }
      }, { passive: true });

      el.addEventListener('touchend', (ev) => {
        el.classList.remove('tap-pressed');
        if (touchMoved || el.disabled) return;
        if (ev.cancelable) ev.preventDefault();
        invoke(ev);
      }, { passive: false });

      el.addEventListener('touchcancel', () => {
        el.classList.remove('tap-pressed');
      }, { passive: true });

      el.addEventListener('click', (ev) => {
        if (el.disabled) return;
        if (ev.cancelable) ev.preventDefault();
        invoke(ev);
      });
    }

    function goToForum() {
      window.location.href = FORUM_PAGE;
    }

    let isSigningUp = false;
    async function handleSignupSubmit() {
      if (isSigningUp) return;
      const btn = document.getElementById('btn-signup');
      const username = normalizeUsername(document.getElementById('auth-username').value);
      const password = document.getElementById('auth-password').value;
      if (!username || !password) return setNotice('Remplis le pseudo et le mot de passe.', true);
      if (username.length < 2) return setNotice('Le pseudo doit contenir au moins 2 caractères.', true);

      isSigningUp = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Création...';
      }
      setNotice('Vérification du pseudo...');
      try {
        const taken = await isUsernameTaken(username);
        if (taken) {
          setNotice('Ce pseudo est déjà utilisé. Choisis-en un autre.', true);
          return;
        }
        const email = usernameToSynthEmail(username);
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { username } }
        });
        if (error) return setNotice(error.message, true);
        if (data?.user?.id) {
          await supabase.from('profiles').update({ username }).eq('id', data.user.id);
        }
        setNotice('Compte créé ! Redirection vers le forum...');
        goToForum();
      } catch (err) {
        setNotice(err?.message || 'Erreur lors de la création.', true);
      } finally {
        isSigningUp = false;
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Créer un compte';
        }
      }
    }

    let isLoggingIn = false;
    let lastLoginAttemptAt = 0;
    async function handleLoginSubmit() {
      const now = Date.now();
      if (isLoggingIn || now - lastLoginAttemptAt < 120) return;
      lastLoginAttemptAt = now;

      const btn = document.getElementById('btn-login');
      const username = normalizeUsername(document.getElementById('auth-username').value);
      const password = document.getElementById('auth-password').value;

      if (!username || !password) {
        return setNotice('Remplis ton pseudo et ton mot de passe.', true);
      }

      isLoggingIn = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Connexion...';
      }
      setNotice('Connexion en cours...');
      try {
        const email = usernameToSynthEmail(username);
        const { data: authData, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          const msg = error.message === 'Invalid login credentials'
            ? 'Pseudo ou mot de passe incorrect.'
            : error.message;
          setNotice(msg, true);
          return;
        }
        if (!authData?.session) {
          setNotice('Connexion refusée.', true);
          return;
        }
        setNotice('Connecté ! Ouverture du forum...');
        goToForum();
      } catch (err) {
        setNotice(err?.message || 'Erreur réseau lors de la connexion.', true);
      } finally {
        isLoggingIn = false;
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Se connecter';
        }
      }
    }

    document.getElementById('auth-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      handleLoginSubmit();
    });
    for (const fieldId of ['auth-username', 'auth-password']) {
      document.getElementById(fieldId)?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          handleLoginSubmit();
        }
      });
    }
    bindUniversalTap(document.getElementById('btn-login'), () => handleLoginSubmit());
    bindUniversalTap(document.getElementById('btn-signup'), () => handleSignupSubmit());

    const { data: existingSession } = await supabase.auth.getSession();
    if (existingSession?.session) {
      goToForum();
    }
  </script>
</body>
</html>
